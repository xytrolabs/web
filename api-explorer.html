<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Valis AI API Explorer — Xytro Labs</title>
<meta name="description" content="Interactive Valis AI API explorer. Try live requests against the Valis OpenAI-compatible API.">
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
<style>
:root{--bg:#f8f9fb;--accent:#4f6ef7}
[data-theme="dark"]{--bg:#0a0a14;--accent:#a78bfa}
html,body{margin:0;padding:0;background:var(--bg);color:#111}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:linear-gradient(135deg,#3b5de7,#4f6ef7);color:#fff}
.topbar img{width:24px;height:24px;filter:brightness(0) invert(1)}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.topbar .links{margin-left:auto;display:flex;gap:16px;font-size:.85rem}
.topbar .links a{color:#fff;opacity:.92;text-decoration:none}
.topbar .links a:hover{opacity:1;text-decoration:underline}
#swagger-ui{max-width:100%;padding:10px}
.swagger-ui{background:transparent}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><img src="valis.png" alt="Valis"> Valis AI API Explorer</div>
  <div class="links">
    <a href="api-docs.html">Docs</a>
    <a href="https://valisapis.xytro.site" target="_blank" rel="noopener">Dashboard</a>
  </div>
</div>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>
<script>
window.onload = function () {
  window.ui = SwaggerUIBundle({
    url: "/openapi.json",
    dom_id: "#swagger-ui",
    deepLinking: true,
    presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
    plugins: [SwaggerUIBundle.plugins.DownloadUrl],
    layout: "StandaloneLayout",
    persistAuthorization: true,
  });
};
</script>
</body>
</html>
