<style>
:root{--bg:#313338;--srf:#2B2D31;--card:#1E1F22;--hov:#3C3F45;--ln:rgba(255,255,255,.06);--ln2:rgba(255,255,255,.08);--ink:#DBDEE1;--mut:#949BA4;--dim:#80848E;--blurple:#5865f2;--green:#23a55a;--red:#ed4245;--yellow:#fffc00;--ease:.2s cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"gg sans","Noto Sans","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;height:100dvh;overflow:hidden}
.app{display:flex;height:100dvh}
.rail{width:72px;background:#1E1F22;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px;overflow-y:auto;border-right:none}
.rail .div{width:32px;height:2px;background:var(--ln2);border-radius:1px;margin:2px 0}
.srv{width:48px;height:48px;border-radius:24px;border:none;cursor:pointer;background:var(--card);color:var(--mut);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all var(--ease);position:relative;flex-shrink:0}
.srv:hover{color:#fff;border-radius:16px;background:var(--blurple)}.srv.ac{color:#fff;border-radius:16px;background:var(--blurple)}.srv.ac::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:4px;height:40px;border-radius:0 3px 3px 0;background:var(--ink)}.srv .badge{position:absolute;bottom:-2px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1;border:3px solid var(--bg)}
.srv::before{content:'';position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:4px;height:0;border-radius:0 4px 4px 0;background:#fff;transition:all var(--ease)}.srv:hover::before{height:20px}.srv.ac::before{height:40px}
.srv.home{background:var(--card)}.srv.home:hover,.srv.home.ac{background:var(--green)}
.srv-add{width:48px;height:48px;border-radius:24px;border:2px dashed var(--ln2);background:transparent;color:var(--green);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--ease)}.srv-add svg{width:20px;height:20px}.srv-add:hover{border-color:var(--green);border-radius:16px;background:rgba(35,165,90,.1)}
.srv[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:62px;top:50%;transform:translateY(-50%);background:#000;color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:200;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.ghost-dot{position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#6366f1;border:3px solid var(--srf);display:none}.ghost-dot.on{display:block}
.sb{width:240px;background:#2B2D31;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.04);flex-shrink:0}
.sb-hd{padding:0 16px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;justify-content:space-between;height:48px;cursor:pointer}.sb-hd:hover{background:var(--hov)}.sb-hd strong{font-size:16px;font-weight:700;color:var(--ink)}
.sb-sc{flex:1;overflow-y:auto;padding:8px 8px}
.cat{margin-bottom:2px}.cat-hd{display:flex;align-items:center;gap:4px;padding:16px 8px 4px;cursor:pointer;color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}.cat-hd:hover{color:var(--ink)}.cat-hd svg{width:10px;height:10px;opacity:.6}
.ch{display:flex;align-items:center;gap:6px;padding:6px 8px;height:32px;border-radius:4px;cursor:pointer;color:var(--mut);font-size:15px;font-weight:500;transition:all var(--ease);border:none;background:transparent;width:100%;text-align:left;font-family:inherit;position:relative}.ch svg{width:20px;height:20px;opacity:.6;flex-shrink:0}.ch:hover{background:#3C3F45;color:var(--ink)}.ch.ac{background:#404249;color:var(--ink)}.ch.ac svg{opacity:1}.ch .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ch.unread{color:var(--ink);font-weight:600}.ch.unread::before{content:'';position:absolute;left:-4px;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--ink);border-radius:0 3px 3px 0}
.dm{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;cursor:pointer;color:var(--mut);transition:all var(--ease)}.dm:hover{background:var(--hov);color:var(--ink)}.dm.ac{background:var(--card);color:var(--ink)}.dm-av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:linear-gradient(135deg,var(--blurple),#eb459e);position:relative}.dm-av.on::after{content:'';position:absolute;bottom:-1px;right:-1px;width:12px;height:12px;border-radius:50%;background:var(--green);border:3px solid var(--srf)}.dm-inf{flex:1;min-width:0}.dm-nm{font-weight:600;font-size:13px}.dm-pv{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dm-tm{font-size:10px;color:var(--dim);flex-shrink:0}

        <button title="Settings" onclick="openUsrSet()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      </div>
    </div>
  </aside>
  <main class="mn">
    <div class="story-bar" id="storyBar" style="display:none"></div>
    <div class="ch-hd" id="chHd" style="display:none"><div class="av" id="chAv">?</div><div class="inf"><div class="nm" id="chNm">Select</div><div class="st" id="chSt"></div></div><div class="acts"><button onclick="joinVoiceChannel()" title="Join Voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
    <button title="Server Settings" id="srvSetBtn" style="display:none" onclick="openSrvSet()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div></div>
    <div class="msgs" id="msgs"><div class="wlcm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-5"/></svg><h2>Welcome to NOVA</h2><p>Servers = Discord. DMs = Snapchat.</p></div></div>

    <div class="img-strip" id="imgStrip"></div>
    <div class="inp" id="inpBar" style="display:none">
      <div class="inp-inner">
        <input type="file" id="fileUp" accept="image/*" style="display:none" onchange="handleFile(this)"/>
        <button title="Emoji" onclick="togEmoji()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></button>
        <input type="text" id="msgIn" placeholder="Message..." onkeydown="if(event.key==='Enter')send()"/>
        <button title="GIF" onclick="togGif()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="9" cy="9" r="1.5"/><circle cx="15" cy="9" r="1.5"/><path d="M7 16c1.5 2 4 2 5.5 1s3.5-2 4.5-1"/></svg></button>
      </div>
      <button class="snd" id="sndBtn" disabled onclick="send()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>

</div>
<div id="popCtr"></div><div id="modCtr"></div><div class="story-viewer" id="storyViewer"></div>

<script>
let me=null,ws=null,online=new Set(),dmThreads=[],users=[],stories=[],channels=[];
let cur='home',ch=null,dm=null,ghost=false,pending=[],storyTimer=null,ghostTimers=[];

function isMsgRendered(msgId){return !!document.querySelector('[data-msgid="'+msgId+'"]')}

function userAvatar(uid){let u=users.find(x=>x.id===uid);if(u&&u.avatar_url)return'style="background:url('+esc(u.avatar_url)+') center/cover;color:transparent"';return''}

function api(u,o){return fetch(u,o).then(r=>r.ok?r.json():Promise.reject(r))}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(d){let dt=new Date(d),h=dt.getHours(),m=dt.getMinutes();return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM')}

async function init(){
  try{me=await api('/auth/me');if(!me.username){location.href='/login';return}me.userId=me.id}catch(e){location.href='/login';return}
  document.getElementById('meAv').textContent=me.username[0].toUpperCase();document.getElementById('meNm').textContent=me.username;
  // Load profile for avatar/status
  try{let p=await api('/nova/api/me/profile');if(p.avatar_url){window._avatar=p.avatar_url;let meAv=document.getElementById('meAv');if(meAv){meAv.style.background='url('+p.avatar_url+') center/cover';meAv.textContent=''}}window._bio=p.bio;window._status=p.status_text;window._phone=p.phone}catch(e){}
  connectWS();await Promise.allSettled([loadDMs(),loadUsers(),loadStories(),loadChannels()]);renderSB();sel('home');setTimeout(initSrvDrag,500);
}
function connectWS(){
  let p=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(p+'//'+location.host+'/nova/ws');
  ws.onopen=()=>console.log('WS live');
  ws.onmessage=e=>{
    try{let d=JSON.parse(e.data);
      if(d.type==='presence'){if(d.online)online.add(d.userId);else online.delete(d.userId);renderSB();renderMem()}
      if(d.type==='message'&&ch&&d.message.channel_id===ch.id&&!isMsgRendered(d.message.id))appendMsg(d.message,cur==='home')
      if(d.type==='dm'&&dm&&d.message.thread_id===dm.threadId&&!isMsgRendered(d.message.id)){appendMsg(d.message,true);if(ghost)scheduleGhostDelete(d.message.id)}
      if(d.type==='reaction'&&ch&&d.channelId===ch.id)loadMsgRxns(d.messageId)
      if(d.type==='story'){loadStories().then(renderStories)}
      if(d.type==='typing'){let el=document.getElementById('typing');el.style.display='block';el.textContent=d.username+' is typing...';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',3000)}
    }catch(ex){}
  };
  ws.onclose=()=>setTimeout(connectWS,3000);
}
async function loadDMs(){try{dmThreads=await api('/nova/api/dm/threads');renderSB()}catch(e){}}
async function loadUsers(){try{users=await api('/nova/api/users')}catch(e){}}
async function loadStories(){try{let r=await api('/nova/api/stories');stories=r.stories||[];renderStories()}catch(e){}}
async function loadChannels(){try{channels=await api('/nova/api/channels');renderSB()}catch(e){}}
async function loadMsgRxns(msgId){try{let r=await api('/nova/api/messages/'+msgId+'/react');updateMsgRxns(msgId,r.reactions||[])}catch(e){}}

function sel(id){
  cur=id;ch=null;dm=null;
  document.querySelectorAll('.srv[data-srv]').forEach(b=>b.classList.toggle('ac',b.dataset.srv===id));
  document.getElementById('chHd').style.display='flex';document.getElementById('inpBar').style.display='flex';
  document.getElementById('msgs').innerHTML='';
  document.getElementById('storyBar').style.display=id==='home'?'flex':'none';
  document.getElementById('camBtn').style.display=id==='home'?'flex':'none';
  document.getElementById('srvSetBtn').style.display=id==='nova'?'inline-flex':'none';
  if(id==='home'){renderDmSB();setHomeHdr();return}
  renderChSB();setNovaHdr();renderMem();renderStories();
}
function setHomeHdr(){document.getElementById('sbHd').innerHTML='<strong>Direct Messages</strong>';document.getElementById('sbHd').onclick=null;document.getElementById('chNm').textContent='Friends';document.getElementById('chSt').innerHTML='<span class="d on"></span> '+online.size+' Online';document.getElementById('chAv').textContent='H';document.getElementById('chAv').style.background='linear-gradient(135deg,var(--green),var(--blurple))'}
function setNovaHdr(){document.getElementById('sbHd').innerHTML='<strong>NOVA</strong><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" style="width:12px;height:12px;opacity:.5"><polyline points="6 9 12 15 18 9"/></svg>';document.getElementById('sbHd').onclick=()=>toggleSrvDropdown();document.getElementById('chNm').textContent='NOVA';document.getElementById('chSt').innerHTML='<span class="d on"></span> '+(ghost?'<span style="color:#6366f1;font-size:10px">Ghost on</span> · ':'')+users.length+' members';document.getElementById('chAv').textContent='NV';document.getElementById('chAv').style.background='linear-gradient(135deg,var(--blurple),#eb459e)'}
function toggleSrvDropdown(){
  let ex=document.querySelector('.srv-drop');if(ex){ex.remove();return}
  let d=document.createElement('div');d.className='srv-drop';
  d.style.cssText='position:fixed;top:56px;left:328px;z-index:500;background:var(--srf);border:1px solid var(--ln2);border-radius:10px;padding:6px;min-width:200px;box-shadow:0 16px 48px rgba(0,0,0,.9);animation:cIn .15s ease';
  let items=[['Server Boost',I.settings,()=>toast('Boosts coming soon')],['Invite People',I.link,()=>{openSrvSet();switchSrvTab('invites')}],'---',['Server Settings',I.settings,()=>openSrvSet()],['Create Channel','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',()=>{openSrvSet();switchSrvTab('channels')}],'---',['Notification Settings',I.bell,()=>toast('Notification prefs')],['Privacy Settings',I.settings,()=>toast('Privacy prefs')],'---',['Leave Server',I.leave,()=>toast('Cannot leave home'),true]];
  items.forEach(it=>{
    if(it==='---'){let s=document.createElement('div');s.style.cssText='height:1px;background:var(--ln);margin:4px 8px';d.appendChild(s);return}
    let[lbl,ico,fn,danger]=it;
    let b=document.createElement('button');b.innerHTML='<span style="width:18px;text-align:center">'+ico+'</span> <span style="flex:1;text-align:left">'+lbl+'</span>';
    b.style.cssText='display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:none;background:transparent;color:'+(danger?'var(--red)':'var(--ink)')+';font:inherit;font-size:13px;cursor:pointer;border-radius:6px;transition:background .08s';
    b.onmouseenter=()=>b.style.background=danger?'rgba(237,66,69,.1)':'var(--hov)';b.onmouseleave=()=>b.style.background='transparent';
    b.onclick=()=>{fn();d.remove()};d.appendChild(b);
  });
  document.body.appendChild(d);
  setTimeout(()=>{let c=()=>{d.remove();document.removeEventListener('click',c)};document.addEventListener('click',c)},10);
}
function renderSB(){cur==='home'?renderDmSB():renderChSB()}
function renderDmSB(){
  let c=document.getElementById('sbSc'),h='';
  h+='<button class="ch" onclick="showFriends()" style="color:var(--green);font-weight:700;margin-bottom:2px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg> Friends</button>';
  h+='<button class="ch" onclick="openStoryPost()" style="color:var(--yellow);font-weight:700;margin-bottom:6px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> My Story</button>';
  h+='<div class="cat"><div class="cat-hd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="width:10px;height:10px"><polyline points="6 9 12 15 18 9"/></svg> DIRECT MESSAGES</div><div class="cat-bd">';
  if(!dmThreads.length)h+='<div style="padding:8px;color:var(--dim);font-size:11px">No DMs. Start one!</div>';
  else dmThreads.forEach(t=>{let oid=t.user_a_id===me.userId?t.user_b_id:t.user_a_id,onm=t.other_username||'?';h+='<div class="dm'+(dm&&dm.threadId===t.id?' ac':'')+'" onclick="openDM(\''+t.id+'\',\''+oid+'\',\''+esc(onm)+'\')"><div class="dm-av'+(online.has(oid)?' on':'')+'">'+esc(onm[0].toUpperCase())+'</div><div class="dm-inf"><div class="dm-nm">'+esc(onm)+'</div><div class="dm-pv">'+esc(t.last_message||'')+'</div></div><div class="dm-tm">'+(t.last_at?fmt(t.last_at):'')+'</div></div>'});
  h+='</div></div><button class="ch" onclick="openNewDm()" style="color:var(--green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> New Message</button>';
  c.innerHTML=h;
}
function renderChSB(){
  let c=document.getElementById('sbSc'),h='';
  let textCh=channels.filter(cn=>cn.type==='text'||cn.type==='announcement'),voiceCh=channels.filter(cn=>cn.type==='voice');
  if(textCh.length){h+='<div class="cat"><div class="cat-hd" onclick="toggleCat(this)" data-open="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:8px;height:8px;transition:transform .2s"><polyline points="6 9 12 15 18 9"/></svg> TEXT CHANNELS</div><div class="cat-bd">';textCh.forEach(cn=>{let unread=window._unread&&window._unread[cn.id];h+='<button class="ch'+(ch&&ch.id===cn.id?' ac':'')+(unread?' unread':'')+'" onclick="selCh(\''+cn.id+'\',\''+esc(cn.name)+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9 9"/></svg><span class="nm">'+esc(cn.name)+'</span></button>'});h+='</div></div>'}
  if(voiceCh.length||true){h+='<div class="cat"><div class="cat-hd" onclick="toggleCat(this)" data-open="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:8px;height:8px;transition:transform .2s"><polyline points="6 9 12 15 18 9"/></svg> VOICE CHANNELS</div><div class="cat-bd">';
  let vcs=[{id:'v1',name:'General Voice'},{id:'v2',name:'Lounge'}];vcs.forEach(v=>{let vc=window._voiceChannels&&window._voiceChannels[v.id]?window._voiceChannels[v.id]:[];let inVC=vc.some(x=>x.userId===me.userId);h+='<button class="ch voice'+(inVC?' ac':'')+'" onclick="joinVoiceChannel(\''+v.id+'\',\''+v.name+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg><span class="nm">'+v.name+(vc.length?'<span style="font-size:10px;color:var(--green);margin-left:4px">'+vc.map(x=>x.username[0].toUpperCase()).join('')+'</span>':'')+'</span><span class="ct" style="font-size:10px;color:var(--dim);margin-left:auto">'+vc.length+'</span></button>'});h+='</div></div>'}
  c.innerHTML=h;
}
function toggleCat(el){
  let open=el.dataset.open==='true';
  el.dataset.open=open?'false':'true';
  let arrow=el.querySelector('svg');if(arrow)arrow.style.transform=open?'rotate(-90deg)':'rotate(0deg)';
  let bd=el.nextElementSibling;if(bd)bd.style.display=open?'none':'';
}
function selCh(id,nm){ch={id,nm};dm=null;document.getElementById('chNm').textContent='#'+nm;renderSB();loadMsgs(id,false)}
async function loadMsgs(id,isDm){
  // Show skeleton loader
  let c=document.getElementById('msgs');
  c.innerHTML=Array.from({length:5},()=>'<div class="skel-msg"><div class="skel skel-av"></div><div class="skel-body"><div class="skel skel-line w80"></div><div class="skel skel-line w60"></div><div class="skel skel-line w40"></div></div></div>').join('');
  try{let url=isDm?'/nova/api/dm/threads/'+id+'/messages?limit=80':'/nova/api/channels/'+id+'/messages?limit=80';let ms=await api(url);renderMsgs(ms,isDm)}catch(e){c.innerHTML='<div class="wlcm"><p>Could not load messages. The channel may not exist yet.</p></div>'}
}
function renderMsgs(ms,isDm){
  let c=document.getElementById('msgs'),h='',ld='',la='';
  if(!ms||!ms.length){c.innerHTML='<div class="wlcm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M4 11a9 9 0 0 1 9 9"/></svg><p>No messages yet. Say hi!</p></div>';return}
  ms.forEach(m=>{
    let d=new Date(m.created_at).toLocaleDateString();if(d!==ld){h+='<div class="msg-div"><span>'+d+'</span></div>';ld=d;la=''}
    let im=m.sender_id===me.userId||m.user_id===me.userId;
    let rxns=(m.reactions||[]).map(r=>'<span class="msg-reaction'+(r.users&&r.users.includes(me.userId)?' mine':'')+'" data-e="'+r.emoji+'" onclick="togRxn(\''+m.id+'\',\''+r.emoji+'\')">'+r.emoji+' '+(r.count||r.users?.length||1)+'</span>').join('');
    if(isDm){
      // Snapchat-style DM bubbles with avatar for received
      let dmAv=!im?'<div class="dm-av-mini" '+userAvatar(m.sender_id||m.user_id)+'>'+esc((m.sender_username||m.username||'?')[0].toUpperCase())+'</div>':'';
      h+='<div class="msg-w dm-msg'+(im?' mine':'')+'" data-msgid="'+m.id+'">'+dmAv+'<div class="msg-bubble'+(im?' mine':'')+'"><div class="msg-body">'+fmtContent(m.content)+'</div></div>'+(rxns?'<div class="msg-reactions" data-rid="'+m.id+'">'+rxns+'</div>':'')+'<div class="msg-status">'+(im?'Sent':'')+' · '+fmt(m.created_at)+'</div></div>';
    }else{
      // Server/Channel style with avatar
      let avHtml='<div class="msg-av" '+userAvatar(m.sender_id||m.user_id)+' onclick="startDM(\''+(m.sender_id||m.user_id)+'\',\''+esc(m.sender_username||m.username)+'\')">'+esc((m.sender_username||m.username||'?')[0].toUpperCase())+'</div>';
      h+='<div class="msg-w" data-msgid="'+m.id+'">'+avHtml+'<div class="msg-main"><div class="msg-hdr"><span class="msg-au">'+esc(m.sender_username||m.username)+'</span><span class="msg-tm">'+fmt(m.created_at)+(m.edited_at?' (edited)':'')+'</span></div><div class="msg-body">'+fmtContent(m.content)+'</div>'+(rxns?'<div class="msg-reactions" data-rid="'+m.id+'">'+rxns+'</div>':'')+'<div class="msg-acts"><button onclick="togRxn(\''+m.id+'\',\'👍\')">👍</button><button onclick="togRxn(\''+m.id+'\',\'❤️\')">❤️</button><button onclick="togRxn(\''+m.id+'\',\'😂\')">😂</button><button onclick="togRxn(\''+m.id+'\',\'🔥\')">🔥</button></div></div></div>';
    }
    la=m.sender_id||m.user_id;
  });
  c.innerHTML=h;c.scrollTop=c.scrollHeight;
}

// ── Role System ──────────────────────────────────────────
const ROLES={owner:{name:'Owner',color:'#ed4245',badge:null,perm:['*']},admin:{name:'Admin',color:'#f97316',badge:null,perm:['kick','ban','manage_channels','manage_roles']},mod:{name:'Moderator',color:'#23a55a',badge:null,perm:['kick','ban','mute','manage_messages']},member:{name:'Member',color:'#8b8baa',badge:null,perm:[]},bot:{name:'BOT',color:'#5865f2',badge:'APP',perm:['read','send']}};
function getRolesForUser(uid){
  if(!uid||!me)return[{role:ROLES.member,id:'member'}];
  let u=users.find(x=>x.id===uid);
  if(!u||!u.roles||!u.roles.length)return[{role:ROLES.member,id:'member'}];
  return u.roles.map(r=>{
    // Check if it's a built-in role (object with name/color) or old string format
    if(typeof r==='object'&&r.name){
      return {role:{name:r.name,color:r.color||'#8b8baa',badge:r.badge||null,perm:[]},id:r.id||r.name.toLowerCase()};
    }
    // Legacy string format
    let roleId=typeof r==='string'?r:r.id||r;
    let roleDef=ROLES[roleId];
    if(!roleDef) return {role:{name:roleId.charAt(0).toUpperCase()+roleId.slice(1),color:'#8b8baa',badge:null,perm:[]},id:roleId};
    return {role:roleDef,id:roleId};
  });
}

let serverOrder=['home','nova'];let draggedSrv=null;
function initSrvDrag(){
  document.querySelectorAll('.srv[data-srv]').forEach(el=>{
    el.draggable=true;
    el.ondragstart=e=>{draggedSrv=el.dataset.srv;e.dataTransfer.effectAllowed='move';el.style.opacity='.4'};
    el.ondragend=e=>{el.style.opacity='1';draggedSrv=null};
    el.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move'};
    el.ondrop=e=>{e.preventDefault();if(!draggedSrv||draggedSrv===el.dataset.srv)return;let from=serverOrder.indexOf(draggedSrv);let to=serverOrder.indexOf(el.dataset.srv);if(from<0||to<0)return;serverOrder.splice(from,1);serverOrder.splice(to,0,draggedSrv);renderSrvOrder();toast('Server order updated')};
  });
}

async function uploadPfp(inp){
  let f=inp.files?.[0];if(!f)return;
  if(!f.type.startsWith('image/')){toast('Please select an image');inp.value='';return}
  if(f.size>2*1024*1024){toast('Image must be under 2MB');inp.value='';return}
  // Immediate local preview
  let rdr=new FileReader();
  rdr.onload=()=>{
    window._avatar=rdr.result;
    let el=document.getElementById('pfpPreview');
    if(el)el.innerHTML='<img src="'+rdr.result+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>';
    updateAllAvatars(rdr.result);
  };
  rdr.readAsDataURL(f);
  // Upload to server
  let fd=new FormData();fd.append('pfp',f);
  try{
    let r=await fetch('/nova/api/pfp-upload',{method:'POST',body:fd});
    if(!r.ok)throw new Error('Upload failed');
    let d=await r.json();
    if(d.url){
      window._avatar=d.url;
      let el=document.getElementById('pfpPreview');
      if(el)el.innerHTML='<img src="'+d.url+'?t='+Date.now()+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>';
      updateAllAvatars(d.url);
      toast('Avatar updated!');
      loadUsers().then(()=>{renderMem();renderSB()});
    }
  }catch(e){toast('Upload failed — try again');inp.value=''}
  inp.value='';
}

async function loadRoleDefs(){
  try{let defs=await api('/nova/api/role-definitions');
  let c=document.getElementById('roleList');if(!c)return;
  let perms=['Administrator','Manage Server','Manage Channels','Manage Roles','Kick Members','Ban Members','Manage Messages','Send Messages','Read Messages','Manage Webhooks','Manage Emojis','Attach Files','Mention Everyone','Connect to Voice','Speak in Voice','Stream Video','Use External Emojis','Add Reactions','Read Message History','Manage Nicknames','Change Nickname','Create Invites','Audit Log Access'];
  let h='';
  defs.forEach(d=>{
    let permList=JSON.parse(d.permissions||'[]');
    let isExpanded=window._expRole===d.id;
    h+='<div style="background:var(--card);border-radius:8px;margin-bottom:6px;overflow:hidden"><div style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer" onclick="window._expRole=window._expRole===\''+d.id+'\'?null:\''+d.id+'\';loadRoleDefs()"><span style="width:14px;height:14px;border-radius:50%;background:'+d.color+';flex-shrink:0"></span><span style="flex:1;font-weight:600;font-size:13px;color:var(--ink)">'+esc(d.name)+'</span>'+(d.badge?'<span style="font-size:9px;background:'+d.color+';color:#fff;padding:1px 6px;border-radius:8px;font-weight:700">'+d.badge+'</span>':'')+'<span style="color:var(--dim);font-size:10px">'+(permList.includes('*')?'All permissions':permList.length+' permissions')+'</span><button style="background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;padding:2px 6px;flex-shrink:0" onclick="event.stopPropagation();deleteRoleDef(\''+d.id+'\')">'+I.del+'</button></div>';
    if(isExpanded){
      h+='<div style="padding:8px 12px 12px;border-top:1px solid var(--ln)"><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">';
      perms.forEach(p=>{let key=p.toLowerCase().replace(/\s+/g,'_');let has=permList.includes('*')||permList.includes(key);
        h+='<label style="display:flex;align-items:center;gap:6px;font-size:11px;color:'+(has?'var(--ink)':'var(--dim)')+';cursor:pointer;padding:3px 0"><input type="checkbox" '+(has?'checked':'')+' onchange="toggleRolePerm(\''+d.id+'\',\''+key+'\',this.checked)" style="accent-color:var(--blurple)"/>'+p+'</label>';
      });
      h+='</div></div>'}
    h+='</div>';
  });
  c.innerHTML=h||'<p style="color:var(--dim);font-size:11px;text-align:center;padding:20px">No roles defined</p>';
  }catch(e){}
}
async function toggleRolePerm(roleId,perm,on){
  try{let defs=await api('/nova/api/role-definitions');let def=defs.find(d=>d.id===roleId);if(!def)return;
    let perms=JSON.parse(def.permissions||'[]');
    if(on){if(!perms.includes(perm))perms.push(perm)}else{perms=perms.filter(p=>p!==perm)}
    await api('/nova/api/role-definitions/'+roleId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({permissions:perms})});
    loadRoleDefs();loadUsers().then(()=>renderMem())
  }catch(e){toast('Permission update failed')}
}

// ── Context Menu System ──────────────────────────────────
function ctxMenu(x,y,items){
  let old=document.querySelector('.ctx');if(old)old.remove();
  let m=document.createElement('div');m.className='ctx';
  m.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;z-index:3000;background:var(--srf);border:1px solid var(--ln2);border-radius:10px;padding:6px;min-width:188px;max-width:260px;box-shadow:0 16px 48px rgba(0,0,0,.9);animation:cIn .15s ease;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)';
  items.forEach((it)=>{
    if(it==='---'){let sep=document.createElement('div');sep.style.cssText='height:1px;background:var(--ln);margin:4px 8px';m.appendChild(sep);return}
    let[lbl,fn,ico,danger]=it;
    let b=document.createElement('button');
    b.style.cssText='display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border:none;background:transparent;color:'+(danger?'var(--red)':'var(--ink)')+';font:inherit;font-size:13px;cursor:pointer;border-radius:6px;transition:background .08s;font-weight:'+(danger?'600':'400');
    if(ico){let s=document.createElement('span');s.innerHTML=ico;s.style.cssText='width:18px;height:18px;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:'+(danger?'.9':'.7');b.appendChild(s)}
    let t=document.createElement('span');t.textContent=lbl;t.style.flex='1';b.appendChild(t);
    b.onmouseenter=()=>b.style.background=danger?'rgba(237,66,69,.1)':'var(--hov)';b.onmouseleave=()=>b.style.background='transparent';
    b.onclick=()=>{fn();m.remove()};m.appendChild(b);
  });
  document.body.appendChild(m);
  let close=()=>{m.remove();document.removeEventListener('click',close)};
  setTimeout(()=>document.addEventListener('click',close),10);
  let rect=m.getBoundingClientRect();
  if(rect.right>window.innerWidth)m.style.left=(x-rect.width)+'px';
  if(rect.bottom>window.innerHeight)m.style.top=(y-rect.height)+'px';
}

// ── Markdown formatting ───────────────────────────────────
function fmtContent(txt){
  if(!txt)return'';
  txt=esc(txt);
  // Bold: **text**
  txt=txt.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  // Italic: *text*
  txt=txt.replace(/\*(.+?)\*/g,'<em>$1</em>');
  // Strikethrough: ~~text~~
  txt=txt.replace(/~~(.+?)~~/g,'<del>$1</del>');
  // Inline code: `text`
  txt=txt.replace(/`(.+?)`/g,'<code style="background:var(--card);padding:1px 5px;border-radius:4px;font-family:monospace;font-size:.9em">$1</code>');
  // Spoiler: ||text||
  txt=txt.replace(/\|\|(.+?)\|\|/g,'<span style="background:var(--dim);color:transparent;border-radius:3px;cursor:pointer" onclick="this.style.color=this.style.color===\'transparent\'?\'var(--ink)\':\'transparent\'">$1</span>');
  // URLs
  txt=txt.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" style="color:var(--blurple)">$1</a>');
  // Images
  txt=txt.replace(/\[image:(.+?)\]/g,'<img src="$1" alt="Image" style="max-width:280px;max-height:200px;border-radius:8px;margin:4px 0;cursor:pointer" onclick="window.open(this.src)"/>');
  // GIFs
  txt=txt.replace(/\[gif:(.+?)\]/g,'<img src="$1" alt="GIF" style="max-width:280px;border-radius:8px;margin:4px 0" onerror="this.style.display=\'none\'"/>');
  return txt;
}

// ── Snapchat-style DM bubbles ─────────────────────────────
function appendMsg(m,isDm){
  let c=document.getElementById('msgs'),im=(m.sender_id||m.user_id)===me.userId;
  let bubble='';
  if(isDm){
    let side=im?'mine':'';
    bubble='<div class="msg-w dm-msg '+side+'" data-msgid="'+(m.id||'')+'"><div class="msg-av" onclick="viewProfile(\''+(m.sender_id||m.user_id)+'\')">'+esc((m.sender_username||m.username||'?')[0].toUpperCase())+'</div><div class="msg-main"><div class="msg-bubble'+(im?' mine':'')+'">'+fmtContent(m.content)+'</div><div class="msg-status">'+(im?'Sent · ':'')+fmt(m.created_at)+'</div></div></div>';
  } else {
    bubble='<div class="msg-w" data-msgid="'+(m.id||'')+'"><div class="msg-av" onclick="viewProfile(\''+(m.sender_id||m.user_id)+'\')">'+esc((m.sender_username||m.username||'?')[0].toUpperCase())+'</div><div class="msg-main"><div class="msg-hdr"><span class="msg-au">'+esc(m.sender_username||m.username)+'</span><span class="msg-tm">'+fmt(m.created_at)+'</span></div><div class="msg-body">'+fmtContent(m.content)+'</div></div></div>';
  }
  c.innerHTML+=bubble;c.scrollTop=c.scrollHeight;
}
// Also need to update renderMsgs to use proper DM bubbles + right-click data attrs
// The renderMsgs already uses msg-w with data-msgid, so right-clicks will work

// ── Update DM list to show streak indicators ───────────────
// Override renderDmSB to add streak emoji where available
let _origRenderDmSB=renderDmSB;
renderDmSB=async function(){
  _origRenderDmSB();
  // Load streaks and update DM list items
  try{let s=await api('/nova/api/streaks');if(s&&s.length){let items=document.querySelectorAll('.dm');s.forEach(st=>{let onm=st.other_username;items.forEach(el=>{if(el.querySelector('.dm-nm')?.textContent===onm){let pv=el.querySelector('.dm-pv');if(pv)pv.textContent=(pv.textContent||'')+'  🔥'+st.count}})})}}catch(e){}
};

// ── Notification badge on server ──────────────────────────
function updateNotifBadge(){let badge=document.querySelector('.srv[data-srv="nova"] .badge');if(!badge)return;let unread=0;/* calculate unread count */badge.textContent=unread||'';badge.style.display=unread?'flex':'none'}

// ── Keyboard shortcuts ────────────────────────────────────
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='Escape'){closeMod();closePops();let ctx=document.querySelector('.ctx');if(ctx)ctx.remove()}
  if(e.ctrlKey&&e.key==='k'){e.preventDefault();document.getElementById('msgIn')?.focus()}
});

document.addEventListener('click',function(e){if(!e.target.closest('.pop')&&!e.target.closest('[onclick*="Emoji"]')&&!e.target.closest('[onclick*="Gif"]'))closePops()});

// ── Reply System ─────────────────────────────────────────
let replyTo=null;
function setReply(msgId,txt,author){
  replyTo={msgId,txt,author};
  let bar=document.getElementById('replyBar');
  if(!bar){bar=document.createElement('div');bar.id='replyBar';bar.style.cssText='display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--card);border-top:1px solid var(--ln);font-size:11px';let inpBar=document.getElementById('inpBar');inpBar.parentNode.insertBefore(bar,inpBar)}
  bar.innerHTML='<span style="color:var(--blurple);font-weight:600">Replying to '+esc(author)+'</span><span style="color:var(--mut);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(txt).slice(0,60)+'</span><button style="background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;padding:0 4px" onclick="cancelReply()">✕</button>';
  document.getElementById('msgIn').focus();
}
function cancelReply(){replyTo=null;let bar=document.getElementById('replyBar');if(bar)bar.remove()}
function fmtReply(txt,author){return'<div style="display:flex;gap:8px;align-items:center;padding:4px 10px;margin-bottom:4px;border-left:3px solid var(--blurple);background:rgba(88,101,242,.05);border-radius:0 6px 6px 0;font-size:12px"><span style="color:var(--blurple);font-weight:600;white-space:nowrap">'+esc(author)+'</span><span style="color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(txt).slice(0,80)+'</span></div>'}
window._voiceChannels=window._voiceChannels||{};
function joinVoiceChannel(id,name){
  id=id||'v1';name=name||'Voice';
  window._voiceChannels[id]=window._voiceChannels[id]||[];
  let vc=window._voiceChannels[id];
  let idx=vc.findIndex(x=>x.userId===me.userId);
  if(idx>=0){vc.splice(idx,1);toast('Disconnected from '+name);renderSB();let bar=document.querySelector('.voice-indicator');if(bar)bar.remove();return}
  vc.push({userId:me.userId,username:me.username});
  // Show voice indicator bar
  let ex=document.querySelector('.voice-indicator');if(ex)ex.remove();
  let bar=document.createElement('div');bar.className='voice-indicator';
  let msgs=document.getElementById('msgs');
  bar.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/></svg><span style="flex:1">Connected to '+esc(name)+'</span><span style="font-size:10px;opacity:.8">'+vc.map(x=>x.username).join(', ')+'</span>';
  bar.onclick=()=>{joinVoiceChannel(id,name)};
  bar.title='Click to disconnect';
  msgs.parentNode.insertBefore(bar,msgs);
  toast('Connected to voice: '+name);
  renderSB();
}
function openCreateServer(){
  let h='<div class=\"mod-over\" onclick=\"if(event.target===this)closeMod()\"><div class=\"mod\"><h3>Create a Server</h3><p style=\"color:var(--mut);font-size:13px;margin-bottom:12px\">Your server is where you and your friends hang out. Make yours and start talking.</p><div class=\"fld\"><label>Server Name</label><input id=\"newSrvName\" placeholder=\"My Awesome Server\" autofocus/></div><div class=\"fld\"><label>Server Icon (optional)</label><input type=\"file\" id=\"newSrvIcon\" accept=\"image/*\"/></div><div class=\"mod-btns\"><button class=\"btn-g\" onclick=\"closeMod()\">Cancel</button><button class=\"btn-p\" onclick=\"createServer()\">Create</button></div></div></div>';
  document.getElementById('modCtr').innerHTML=h;
}
async function createServer(){
  let nm=document.getElementById('newSrvName')?.value?.trim();if(!nm){toast('Enter a server name');return}
  try{await api('/nova/api/channels',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nm.replace(/[^a-z0-9-]/g,'-').toLowerCase(),type:'text'})});
  toast('Server \"'+nm+'\" created! Add channels in Server Settings.');closeMod();loadChannels()}catch(e){toast('Server creation failed')}
}

// ── Update sender avatar in sidebar footer ────────────────
setInterval(()=>{if(me&&window._avatar){let el=document.getElementById('meAv');if(el&&window._avatar)el.style.backgroundImage='url('+window._avatar+'?t='+Date.now()+')';el.style.backgroundSize='cover';el.textContent=''}},5000);

// ── Friends System ───────────────────────────────────────
async function showFriends(){
  let h='<div class="mod-over" onclick="if(event.target===this)closeMod()"><div class="mod" style="max-width:480px"><h3>Friends</h3>';
  h+='<div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn-p" style="font-size:11px;padding:5px 12px" onclick="showFriendTab(\'all\')" id="friendTabAll">All</button><button class="btn-g" style="font-size:11px;padding:5px 12px" onclick="showFriendTab(\'requests\')" id="friendTabReq">Requests</button><button class="btn-g" style="font-size:11px;padding:5px 12px" onclick="showFriendTab(\'add\')" id="friendTabAdd">Add Friend</button></div>';
  h+='<div id="friendContent"><p style="color:var(--dim);text-align:center;padding:20px">Loading...</p></div>';
  h+='<div class="mod-btns"><button class="btn-g" onclick="closeMod()">Close</button></div></div></div>';
  document.getElementById('modCtr').innerHTML=h;
  window._friendTab='all';loadFriendAll();
}
function showFriendTab(t){
  window._friendTab=t;
  ['all','requests','add'].forEach(x=>{let b=document.getElementById('friendTab'+x.charAt(0).toUpperCase()+x.slice(1));if(b){b.className=t===x?'btn-p':'btn-g';b.style.fontSize='11px';b.style.padding='5px 12px'}});
  if(t==='all')loadFriendAll();
  else if(t==='requests')loadFriendReqs();
  else if(t==='add')showAddFriend();
}
async function loadFriendAll(){
  try{let f=await api('/nova/api/friends');let c=document.getElementById('friendContent');if(!c)return;
    if(!f.length){c.innerHTML='<p style="color:var(--dim);text-align:center;padding:20px">No friends yet. Add some!</p>';return}
    c.innerHTML=f.map(u=>'<div class="usr-row" style="justify-content:space-between"><div style="display:flex;align-items:center;gap:9px" onclick="closeMod();startDM(\''+u.id+'\',\''+esc(u.username)+'\')"><div class="u-av">'+esc((u.display_name||u.username)[0].toUpperCase())+'</div><div><div style="font-weight:600;font-size:13px">'+esc(u.display_name||u.username)+'</div><div style="font-size:10px;color:'+(online.has(u.id)?'var(--green)':'var(--dim)')+'">'+(online.has(u.id)?'Online':u.status_text||'Offline')+'</div></div></div><button class="btn-d" style="font-size:10px;padding:3px 8px" onclick="event.stopPropagation();removeFriend(\''+u.id+'\')">Remove</button></div>').join('');
  }catch(e){}
}
async function loadFriendReqs(){
  try{let r=await api('/nova/api/friends/requests');let c=document.getElementById('friendContent');if(!c)return;
    let h='';
    if(r.incoming&&r.incoming.length){h+='<h4 style="font-size:11px;color:var(--mut);margin-bottom:6px">INCOMING</h4>';r.incoming.forEach(u=>{h+='<div class="usr-row" style="justify-content:space-between;margin-bottom:4px"><div style="display:flex;align-items:center;gap:9px"><div class="u-av">'+esc(u.username[0].toUpperCase())+'</div><div style="font-weight:600;font-size:13px">'+esc(u.username)+'</div></div><div style="display:flex;gap:4px"><button class="btn-p" style="font-size:10px;padding:3px 10px" onclick="accFriend(\''+u.id+'\')">Accept</button><button class="btn-d" style="font-size:10px;padding:3px 8px" onclick="rejFriend(\''+u.id+'\')">Decline</button></div></div>'})}
    if(r.outgoing&&r.outgoing.length){h+='<h4 style="font-size:11px;color:var(--mut);margin-bottom:6px;margin-top:10px">OUTGOING</h4>';r.outgoing.forEach(u=>{h+='<div class="usr-row" style="justify-content:space-between;margin-bottom:4px"><div style="display:flex;align-items:center;gap:9px"><div class="u-av">'+esc(u.username[0].toUpperCase())+'</div><div style="font-weight:600;font-size:13px">'+esc(u.username)+'</div></div><button class="btn-d" style="font-size:10px;padding:3px 8px" onclick="rejFriend(\''+u.id+'\')">Cancel</button></div>'})}
    if(!h)c.innerHTML='<p style="color:var(--dim);text-align:center;padding:20px">No pending requests</p>';else c.innerHTML=h;
  }catch(e){}
}
function showAddFriend(){
  let c=document.getElementById('friendContent');if(!c)return;
  c.innerHTML='<div class="fld"><input type="text" id="addFriendSrch" placeholder="Search by username..." oninput="srchAddFriend()" autofocus/></div><div id="addFriendRes" style="max-height:260px;overflow-y:auto"></div>';
  srchAddFriend();
}
function srchAddFriend(){
  let q=(document.getElementById('addFriendSrch')?.value||'').toLowerCase(),c=document.getElementById('addFriendRes');if(!c)return;
  let f=users.filter(u=>u.id!==me.userId&&(!q||u.username.toLowerCase().includes(q))).slice(0,20);
  c.innerHTML=f.length?f.map(u=>'<div class="usr-row" onclick="sendFriendReq(\''+u.id+'\',\''+esc(u.username)+'\')"><div class="u-av">'+esc(u.username[0].toUpperCase())+'</div><div>'+esc(u.username)+'</div></div>').join(''):'<p style="color:var(--dim);text-align:center;padding:16px">No users found</p>';
}
async function sendFriendReq(uid,un){
  try{await api('/nova/api/friends/request/'+uid,{method:'POST'});toast('Friend request sent to '+un+'!');showFriendTab('requests')}catch(e){toast('Already sent or failed')}
}
async function accFriend(uid){try{await api('/nova/api/friends/accept/'+uid,{method:'POST'});toast('Friend added!');loadFriendReqs()}catch(e){toast('Failed')}}
async function rejFriend(uid){try{await api('/nova/api/friends/reject/'+uid,{method:'POST'});toast('Removed');loadFriendReqs()}catch(e){toast('Failed')}}
async function removeFriend(uid){if(!confirm('Remove this friend?'))return;try{await api('/nova/api/friends/reject/'+uid,{method:'POST'});toast('Friend removed');loadFriendAll()}catch(e){toast('Failed')}}

init();
</script>
